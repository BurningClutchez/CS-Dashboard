# homelab-dash configuration  (/etc/homelab-dash/config.ini, owned by root, mode 644)
# Full guide: docs/INSTALL.md
#
# Easiest start: let the installer write a draft for you:
#     sudo python3 -I -B /opt/homelab-dash/detect.py --write /etc/homelab-dash/config.ini.draft
# This file is a fully commented example of every option.
#
# NEVER put passwords or API keys in this file. Put them in root-only files
# under /etc/homelab-dash/secrets/ (mode 600) and point to them with *_file.

[general]
# hostname =                 # shown in the page title; default: the server's hostname
interval = 60                # how often the timer runs the collector (informational)
check_timeout = 8            # seconds per individual check
deadline = 30                # the whole run gives up on unfinished cards after this
stale_after = 180            # the page says "data is stale" after this many seconds
history_hours = 24

[web]
bind = 0.0.0.0
port = 8088                  # if you change this, also change SocketBindAllow (see INSTALL.md)
# Names you may type in the browser (IP addresses always work). "auto" = this
# machine's hostname plus .local/.lan/.home.arpa. Add your Tailscale MagicDNS name.
allowed_hosts = auto

[thresholds]
disk_warn = 80
disk_crit = 90
temp_warn = 75
temp_crit = 85
disk_temp_warn = 50
disk_temp_crit = 60
mem_warn = 90
mem_crit = 97
cpu_warn = 90
cpu_crit = 98
load_warn = 1.5              # 5-minute load average per CPU core
load_crit = 3.0

[system]
failed_units = yes           # show failed systemd units
journal_errors = yes         # count error-level log lines in the last hour

[disks]
mounts = auto                # or a list:  / /mnt/media /mnt/backup
exclude_mounts = /boot/efi /snap/* /var/lib/docker/* /run/* /sys/* /proc/* /dev/*
smart = auto                 # auto | off | list like: /dev/sda /dev/sdb:sat /dev/nvme0
smart_interval = 1800        # seconds between SMART reads per drive
smart_skip_standby = yes     # never wake sleeping hard disks just to read SMART
raid = auto                  # mdadm (/proc/mdstat) and ZFS pools if present

[network]
interfaces = auto            # or a list: enp3s0 tailscale0
dns_test = example.com       # a name to resolve (tests Pi-hole/your DNS); empty = off
tailscale = auto             # auto | yes | no

[docker]
enabled = auto               # auto = if /run/docker.sock exists
socket = /run/docker.sock
# Containers listed here turn RED when stopped. Others show grey "stopped".
must_run = jellyfin pihole
hide =                       # containers to leave off the page

# ------------------------------------------------------------- LAN addresses
# One card with (1) the free IPs left on Docker macvlan/ipvlan networks and
# (2) the local domains in use, as clickable links. Built from data the other
# cards already read (Docker, Pi-hole local DNS) plus /etc/hosts and the ARP
# table; it sends nothing on the network. Hidden when there is nothing to show.
[addresses]
enabled = auto               # auto | yes | no
warn_free = 5                # yellow when a network has fewer free IPs than this

[domains]
enabled = auto               # auto | yes | no
suffix = home.arpa           # list names ending in .home.arpa
scheme = http                # links open as http://name/ (or https)
hosts_file =                 # default: /etc/hosts
extra =                      # more names to list, e.g. grafana.home.arpa
links =                      # per-name link overrides: nas.home.arpa=https://nas.home.arpa:5001/
hide =                       # names to leave off

# ------------------------------------------------------------------ services
# One section per thing to show as up/down. Section names: letters, digits, - _ . @
#   type = systemd   unit = smbd nmbd
#   type = http      url = http://127.0.0.1:3001/   expect = 200-399   verify_tls = yes
#   type = tcp       host = 127.0.0.1   port = 22
#   type = process   match = valheim_server   user = vhserver
#   type = docker    container = jellyfin
# Optional on all: label =, group = (heading on the card), timeout =,
#                  link = (opens the service's own web UI from the page)

[service:samba]
type = systemd
unit = smbd nmbd
label = Samba file shares
group = File sharing

[service:uptime-kuma]
type = http
url = http://127.0.0.1:3001/
label = Uptime Kuma
group = Monitoring

[service:ssh]
type = tcp
host = 127.0.0.1
port = 22
label = SSH
group = System

# ------------------------------------------------- secrets from an Ansible vault
# Optional, see docs/SECRETS-FROM-VAULT.md. Secrets are kept in RAM only:
#   ansible-vault view /path/vault.yml | sudo python3 -I -B /opt/homelab-dash/unlock.py
# map = vault_key=file_name ...  (point password_file/key_file below at dir/file_name)
# [vault]
# dir = /run/homelab-dash-secrets
# map = pihole_password=pihole.pass jellyfin_api_key=jellyfin.key plex_token=plex.token

# -------------------------------------------------------------------- stats
# Pi-hole: v6 uses the web/app password, v5 the API token (Settings > API).
# If Pi-hole runs on a Docker macvlan IP the server itself cannot reach it;
# see INSTALL.md "macvlan".
[pihole]
url = http://127.0.0.1:80
version = auto
password_file = /etc/homelab-dash/secrets/pihole.pass
# RAM-only (vault) mode:  password_file = /run/homelab-dash-secrets/pihole.pass
#                         session_file  = /run/homelab-dash-secrets/pihole.sid

# Jellyfin / Emby / Plex stream counts. The key file holds the API key
# (Jellyfin/Emby: Dashboard > API Keys) or the Plex token.
# show_titles = yes also lists what is playing and who (off by default: privacy).
[media:jellyfin]
type = jellyfin
url = http://127.0.0.1:8096
key_file = /etc/homelab-dash/secrets/jellyfin.key
show_titles = no

# [media:plex]
# type = plex
# url = http://127.0.0.1:32400
# key_file = /etc/homelab-dash/secrets/plex.token

# ------------------------------------------------------------- game servers
# protocol = a2s (Steam query: Valheim, CS2, Rust, ARK, 7 Days, ...) | minecraft | tcp | none
# process/user: optional "is the process running" check (LinuxGSM user name).
[game:valheim]
label = Valheim
protocol = a2s
host = 127.0.0.1
port = 2457
process = valheim_server
user = vhserver

# [game:minecraft]
# label = Minecraft
# protocol = minecraft
# host = 127.0.0.1
# port = 25565
